services:
  app:
    build: .
    ports:
      - "20790:20790"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/gym
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
